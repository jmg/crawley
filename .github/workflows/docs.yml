name: Docs

# Rebuild + publish the MkDocs site to the gh-pages branch on every push, so the
# docs (incl. the mkdocstrings API reference pulled from docstrings) never go
# stale relative to the code.
on:
  push:
    branches: [crawley-cloud-proxy-pool, master, main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build & deploy
        run: mkdocs gh-deploy --force --strict
